<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>كاميرا مضحكة</title>
<style>
:root{--body:#16181d;--ring:#f2f2f2;--red:#e63b2e;--dim:#8b909c;--btn:#2a2d35}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--body);color:var(--ring);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 28px) 24px calc(env(safe-area-inset-bottom,0px) + 36px)}
.hint{color:var(--dim);font-size:1rem;margin:0;text-align:center}
.shutter{width:min(72vw,340px);aspect-ratio:1;border-radius:50%;border:10px solid var(--ring);background:var(--body);padding:0;cursor:pointer;display:grid;place-items:center;transition:transform .08s}
.shutter::after{content:"";width:78%;height:78%;border-radius:50%;background:var(--red);transition:transform .08s,background .08s}
.shutter:active{transform:scale(.96)}
.shutter:active::after{transform:scale(.9);background:#c22d22}
.show{font:inherit;font-size:1.25rem;font-weight:700;color:var(--ring);background:var(--btn);border:0;border-radius:16px;padding:16px 36px;cursor:pointer;min-width:220px}
.show:active{transform:scale(.97)}
.show:focus-visible,.shutter:focus-visible{outline:3px solid #fff;outline-offset:4px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
#flash.go{animation:fl .45s ease-out}
@keyframes fl{0%{opacity:1}30%{opacity:1}100%{opacity:0}}
#viewer{position:fixed;inset:0;background:rgba(10,11,14,.94);display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;z-index:40;padding:20px}
#viewer.on{display:flex}
#viewer img{max-width:100%;max-height:76vh;border:10px solid #fff;border-bottom-width:36px;border-radius:4px;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.85) rotate(-3deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
#viewer p{margin:0;color:var(--dim)}
@media (prefers-reduced-motion:reduce){#viewer img{animation:none}#flash.go{animation-duration:.2s}}
</style>
</head>
<body>
<div class="app">
  <p class="hint">كلك على الدائرة</p>
  <button class="shutter" id="shutter" aria-label="التقاط"></button>
  <button class="show" id="show">أظهر الصورة</button>
</div>
<div id="flash"></div>
<div id="viewer"><img id="photo" alt=""><p>كلك فأي مكاين باش تسد</p></div>

    bag=[...Array(N).keys()].map(i=>i+1);
    for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}
    if(bag[bag.length-1]===last&&N>1){bag.unshift(bag.pop())}
  }
  last=bag.pop();return last;
}
let ctx;
function audio(){ if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)()} if(ctx.state==="suspended")ctx.resume(); return ctx}
function click(t,freq,dur,vol){
  const c=ctx,len=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
  const s=c.createBufferSource();s.buffer=buf;
  const f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=freq;f.Q.value=1.2;
  const g=c.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);
}
function shutterSound(){
  try{const c=audio(),t=c.currentTime;
    click(t,2600,0.05,1.4);
    click(t+0.07,1400,0.09,1.1);
    const o=c.createOscillator(),g=c.createGain();o.type="square";o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(200,t+0.06);
    g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.1);
  }catch(e){}
}

let track=null,torchOK=null,starting=null;
async function initTorch(){
  if(torchOK!==null)return torchOK;
  if(starting)return starting;
  starting=(async()=>{
    try{
      const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
      const t=s.getVideoTracks()[0];
      const caps=t.getCapabilities?t.getCapabilities():{};
      if(caps.torch){track=t;torchOK=true}else{t.stop();torchOK=false}
    }catch(e){torchOK=false}
    return torchOK;
  })();
  return starting;
}
async function torch(on){
  if(!track)return;
  try{await track.applyConstraints({advanced:[{torch:on}]})}catch(e){}
}
async function realFlash(){
  if(await initTorch()){await torch(true);setTimeout(()=>torch(false),350)}
}
const flash=document.getElementById("flash");
document.getElementById("shutter").addEventListener("click",()=>{
  shutterSound();
  realFlash();
  flash.classList.remove("go");void flash.offsetWidth;flash.classList.add("go");
  if(navigator.vibrate)navigator.vibrate(30);
});
const viewer=document.getElementById("viewer"),photo=document.getElementById("photo");
document.getElementById("show").addEventListener("click",()=>{
  photo.src=IMGS[next()-1];
  viewer.classList.add("on");
});
viewer.addEventListener("click",()=>viewer.classList.remove("on"));
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
